[package]
name = "manf"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
authors = ["Gamer Dad"]
repository = "https://github.com/gmrdad82/pfx-scene"
homepage = "https://pitomd.com"
description = "The .manf container: a magic, a version and an uncompressed chunk table with names, then 8-byte aligned chunks, each checksummed and stored or compressed (LZ4 block or raw deflate), read one chunk at a time and written atomically"

[lib]
name = "manf"

[dependencies]
miniz_oxide = "0.9"

[dev-dependencies]
crc32fast = "1.5"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
