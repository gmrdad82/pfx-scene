name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: bin/docs-bundle "$GITHUB_REF_NAME"
      - name: Attach the docs bundle to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            awk -v tag="$TAG" '/^## /{p = ($2 == tag); next} p' CHANGELOG.md >tmp/notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "pfx-scene ${TAG#v}" --notes-file tmp/notes.md
          fi
          gh release upload "$TAG" "tmp/docs-$TAG.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
